name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every check runs offline: no production secrets are needed anywhere in this pipeline.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  UV_VERSION: "0.11.24"

jobs:
  # ─────────────────────────────── Backend ────────────────────────────────
  backend-static:
    name: backend · ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            run: uv run ruff check --output-format=github .
          - check: format
            run: uv run ruff format --check .
          - check: typecheck
            run: uv run mypy app scripts tests alembic/env.py
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - run: ${{ matrix.run }}

  database:
    name: database · migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eximion
          POSTGRES_PASSWORD: eximion
          POSTGRES_DB: eximion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eximion"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://eximion:eximion@localhost:5432/eximion
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Apply migrations to an empty database
        run: uv run alembic upgrade head
      - name: ORM models match migrations (no drift)
        run: uv run alembic check
      - name: Downgrade to base and re-apply (reversible)
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Schema contains the expected tables
        run: |
          uv run python - <<'PY'
          from sqlalchemy import create_engine, inspect
          from app.core.config import get_settings
          engine = create_engine(get_settings().database_url.get_secret_value())
          tables = set(inspect(engine).get_table_names())
          expected = {"clinical_cases", "case_findings", "case_answers", "case_submissions"}
          missing = expected - tables
          assert not missing, f"missing tables: {missing}"
          print("tables:", sorted(tables))
          PY

  backend-tests:
    name: backend · tests
    runs-on: ubuntu-latest
    needs: [backend-static]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: eximion
          POSTGRES_PASSWORD: eximion
          POSTGRES_DB: eximion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eximion"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://eximion:eximion@localhost:5432/eximion
      TEST_DATABASE_URL: postgresql+psycopg://eximion:eximion@localhost:5432/eximion_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked
      - name: Integration tests against real PostgreSQL (coverage gate 90%)
        run: uv run pytest --cov --cov-report=term-missing

  # ─────────────────────────────── Frontend ───────────────────────────────
  frontend-static:
    name: frontend · ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            run: npm run lint
          - check: typecheck
            run: npm run typecheck
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: ${{ matrix.run }}

  frontend-tests:
    name: frontend · tests
    runs-on: ubuntu-latest
    needs: [frontend-static]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test

  frontend-build:
    name: frontend · production build
    runs-on: ubuntu-latest
    needs: [frontend-tests]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  # ────────────────────────────── LLM pipeline ────────────────────────────
  llm-static:
    name: llm · ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: lint
            run: uv run ruff check --output-format=github .
          - check: format
            run: uv run ruff format --check .
          - check: typecheck
            run: uv run mypy src tests
    defaults:
      run:
        working-directory: llm_pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: llm_pipeline/uv.lock
      - run: uv sync --locked
      - run: ${{ matrix.run }}

  llm-tests:
    name: llm · tests
    runs-on: ubuntu-latest
    needs: [llm-static]
    defaults:
      run:
        working-directory: llm_pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: llm_pipeline/uv.lock
      - run: uv sync --locked
      - name: Tests (coverage gate 85%)
        run: uv run pytest --cov --cov-report=term-missing

  llm-eval:
    name: llm · extraction eval (offline)
    runs-on: ubuntu-latest
    needs: [llm-tests]
    defaults:
      run:
        working-directory: llm_pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: llm_pipeline/uv.lock
      - run: uv sync --locked
      - name: Deterministic eval, fake provider (no credentials, metric gates)
        run: uv run clinical-extraction eval --provider fake --output eval-summary.json
      - name: Publish the eval summary
        if: always()
        run: |
          {
            echo '### Extraction eval (offline)'
            echo '```json'
            cat eval-summary.json
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: eval-summary
          path: llm_pipeline/eval-summary.json

  # ─────────────────────── Shared contract (no drift) ────────────────────
  contract:
    name: contract · OpenAPI and generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked
        working-directory: backend
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: contracts/openapi.json is up to date with the FastAPI app
        working-directory: backend
        run: |
          uv run python -m scripts.export_openapi
          git diff --exit-code -- ../contracts/openapi.json \
            || { echo "::error file=contracts/openapi.json::stale - run 'make openapi'"; exit 1; }
      - name: Generated TypeScript types match the contract
        working-directory: frontend
        run: |
          npm run generate:types
          git diff --exit-code -- src/generated/api.d.ts \
            || { echo "::error file=frontend/src/generated/api.d.ts::stale - run 'make types'"; exit 1; }

  # ───────────────────────────── Quality gates ───────────────────────────
  secret-scan:
    name: quality · secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The gitleaks CLI is used directly rather than the action: the action scans
      # the push range, whose base commit does not exist after a history rewrite.
      - name: Scan the full git history
        env:
          GITLEAKS_VERSION: 8.30.0
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1
      - name: No .env or credential files are tracked
        run: |
          if git ls-files | grep -iE '(^|/)\.env$|service-account|credentials.*\.json$|\.(pem|key|p12)$'; then
            echo "::error::credential-shaped files are tracked"; exit 1
          fi
          echo "no credential files tracked"

  dependency-audit:
    name: quality · audit ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend deps
            kind: python
            dir: backend
          - name: llm deps
            kind: python
            dir: llm_pipeline
          - name: frontend deps
            kind: node
            dir: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        if: matrix.kind == 'python'
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v6
        if: matrix.kind == 'node'
        with:
          node-version: ${{ env.NODE_VERSION }}
      # --no-emit-project keeps the local, unpublished package out of the audit set.
      - name: pip-audit the locked third-party dependencies
        if: matrix.kind == 'python'
        run: |
          uv export --directory ${{ matrix.dir }} --no-emit-project --no-hashes -o /tmp/reqs.txt
          uvx pip-audit --strict -r /tmp/reqs.txt
      - name: npm audit
        if: matrix.kind == 'node'
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high

  workflow-lint:
    name: quality · workflow and shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned versions: a linter that silently changes behaviour is not a gate.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          curl -sSfL -o actionlint.tar.gz             "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck scripts/*.sh

  # ──────────────────────── Images and end-to-end ────────────────────────
  docker-build:
    name: docker · build images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, llm-tests]
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.image }}
          push: false
          load: true
          tags: eximion-${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint sh eximion-${{ matrix.image }}:ci -c 'id -u')"
          [ "${uid}" != "0" ] || { echo "::error::image runs as root"; exit 1; }
          echo "runs as uid ${uid}"

  e2e-smoke:
    name: e2e · smoke test the vertical slice
    runs-on: ubuntu-latest
    needs: [docker-build, database, contract]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Start the full stack
        run: docker compose up -d --build --wait
      - name: Migration service completed successfully
        run: |
          code="$(docker inspect -f '{{.State.ExitCode}}' eximion-migrate-1)"
          [ "${code}" = "0" ] || { echo "::error::migration container exited ${code}"; exit 1; }
      - name: Smoke test (create → read → score, answer key must not leak)
        run: bash scripts/smoke.sh
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v

  # Single required check: green only when every job above is green.
  ci:
    name: CI
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend-static
      - database
      - backend-tests
      - frontend-static
      - frontend-tests
      - frontend-build
      - llm-static
      - llm-tests
      - llm-eval
      - contract
      - secret-scan
      - dependency-audit
      - workflow-lint
      - docker-build
      - e2e-smoke
    steps:
      - name: Verify every job succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::one or more CI jobs did not succeed"; exit 1
          fi
          echo "all CI jobs succeeded"
